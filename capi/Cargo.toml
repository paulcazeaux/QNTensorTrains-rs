[package]
name = "qntt-capi"
version = "0.1.1"
edition = "2024"
description = "C ABI for qntt (consumed by the Julia package in ../julia)"
license = "GPL-3.0-or-later"

[lib]
name = "qntt_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]

[dependencies]
qntt = { path = "..", default-features = false }
num-complex = "0.4.6"
rand = "0.10.2"
rand_xoshiro = "0.8.1"
rayon = "1.12.0"
paste = "1.0.15"
