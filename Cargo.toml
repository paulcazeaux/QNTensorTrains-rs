[package]
name = "qntt"
version = "0.1.1"
edition = "2024"
description = "Quantum-number-preserving block-sparse tensor trains for fermionic many-body systems"
license = "GPL-3.0-or-later"

[workspace]
members = ["capi", "exkit", "testkit"]

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = 1

[features]

[dependencies]
faer = "0.24.4"
num-bigint = "0.4"
num-complex = "0.4.6"
num-rational = "0.4"
num-traits = "0.2"
rand = "0.10.2"
rand_distr = "0.6.0"
rand_xoshiro = "0.8.1"
rayon = "1.12.0"
rustc-hash = "2"
thiserror = "2.0.18"

[dev-dependencies]
qntt-testkit = { path = "testkit" }
qntt-exkit = { path = "exkit" }
qntt = { path = ".", default-features = false }

